# Milo Julo host app: its own address and build, sharing the Hub Durable Object owned by the "milo-julo" Worker.
name = "milo-julo-host"
main = "../../src/gateway.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../../../client/dist/host"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/uploads/*", "/.well-known/*"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
script_name = "milo-julo"

[vars]
APP = "host"
