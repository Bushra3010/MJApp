name = "milo-julo"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/uploads/*", "/.well-known/*"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
EMAIL_FROM = "Milo Julo <no-reply@example.com>"
VAPID_SUBJECT = "mailto:support@example.com"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   JWT_SECRET               48+ random chars (required)
#   ADMIN_EMAILS             your email: signing up/in with it makes you admin
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
#   RESEND_API_KEY
#   TURN_KEY_ID / TURN_KEY_API_TOKEN      (Cloudflare Realtime → TURN)
#   ANDROID_SHA256_FINGERPRINT            (optional, Play Store TWA)
